- type: entity
  name: theremin
  parent: BasePlaceableInstrumentRotatable
  id: ThereminInstrument
  description: The future is now.
  components:
  - type: Instrument
    bank: 110
    program: 1
  - type: Sprite
    sprite: _Impstation/Objects/Fun/Instruments/theremin.rsi
    state: theremin
  - type: PhysicalComposition #imp edit start
    materialComposition:
      Steel: 500
      Wood: 250 #imp edit end

- type: entity
  parent: BasePlaceableInstrumentRotatable
  id: DrumKitInstrument
  name: drum kit
  description: What is this?! A drum kit for ants?!
  components:
  - type: Instrument
    bank: 110
    program: 2
    allowPercussion: true
  - type: Sprite
    sprite: _Impstation/Objects/Fun/Instruments/drumkit.rsi
    state: drumkit
  - type: PhysicalComposition #imp edit start
    materialComposition:
      Steel: 1500 #imp edit end

- type: entity
  parent: BasePlaceableInstrumentRotatable
  id: HammondOrganInstrument
  name: hammond organ
  description: It's like the other organ, but joyful!
  components:
  - type: Instrument
    bank: 110
    program: 3
  - type: Sprite
    sprite: _Impstation/Objects/Fun/Instruments/hammondorgan.rsi
    state: hammondorgan
  - type: PhysicalComposition #imp edit start
    materialComposition:
      Wood: 1500 
      Steel: 600 #imp edit end

- type: entity
  parent: BasePlaceableInstrumentRotatable
  id: DulcimerInstrument
  name: hammered dulcimer
  description: For fans of ren fairs.
  components:
  - type: Instrument
    program: 15
  - type: Sprite
    sprite: _Impstation/Objects/Fun/Instruments/dulcimer.rsi
    state: dulcimer
  - type: PhysicalComposition #imp edit start
    materialComposition:
      Wood: 1000 
      Steel: 300 #imp edit end
